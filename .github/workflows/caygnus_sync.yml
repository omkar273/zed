# Merges upstream Zed's main branch into this fork's main every day, then
# builds and publishes a Caygnus release whenever main has changed since the
# last release.
#
# If upstream merges cleanly, it is pushed straight to main. If it conflicts
# with the fork's changes, the run pushes it to the upstream-sync branch, opens
# a pull request for you to resolve and review, and fails so that you get
# notified. Later runs leave that pull request alone until you merge or close it.
#
# Without a CAYGNUS_SYNC_TOKEN secret it uses the built-in token, which can't
# push changes to workflow files, so the merge keeps the fork's own
# .github/workflows and drops upstream's changes there (the fork doesn't run
# Zed's CI anyway). If GitHub still refuses the push, the run fails and asks you
# to sync by hand. Opening the conflict pull request with the built-in token
# needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings.
#
# A CAYGNUS_SYNC_TOKEN secret (a fine-grained token for this repository with
# Contents, Workflows and Pull requests write access) merges upstream's
# workflows too and never needs a hand sync.
name: caygnus_sync
on:
  schedule:
  # 03:00 IST.
  - cron: '30 21 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: caygnus-sync
  cancel-in-progress: false
env:
  SYNC_BRANCH: upstream-sync
jobs:
  merge_upstream:
    if: github.repository_owner == 'omkar273'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      sha: ${{ steps.release.outputs.sha }}
      attention: ${{ steps.merge.outputs.attention }}
    steps:
    - name: Check out
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.CAYGNUS_SYNC_TOKEN || github.token }}
    - name: Merge upstream Zed
      id: merge
      env:
        GH_TOKEN: ${{ secrets.CAYGNUS_SYNC_TOKEN || github.token }}
        HAS_SYNC_TOKEN: ${{ secrets.CAYGNUS_SYNC_TOKEN != '' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add upstream https://github.com/zed-industries/zed.git
        git fetch --no-tags upstream main

        # Replaces .github/workflows with the version in the given commit.
        use_workflows_from() {
          git rm -r -q -f --ignore-unmatch -- .github/workflows
          git checkout "$1" -- .github/workflows
        }

        needs_attention() {
          echo "$1" >> "$GITHUB_STEP_SUMMARY"
          echo "attention=$1" >> "$GITHUB_OUTPUT"
        }

        if git merge-base --is-ancestor upstream/main HEAD; then
          echo "main already has everything from upstream."
          exit 0
        fi

        upstream_sha=$(git rev-parse --short upstream/main)
        git merge --no-ff --no-commit upstream/main || true
        git rev-parse -q --verify MERGE_HEAD > /dev/null \
          || { echo "::error::git couldn't start merging upstream Zed ${upstream_sha}."; exit 1; }
        if [[ "$HAS_SYNC_TOKEN" != "true" ]]; then
          use_workflows_from HEAD
        fi

        conflicts=$(git diff --name-only --diff-filter=U)
        if [[ -z "$conflicts" ]]; then
          git commit -q --no-edit -m "Merge upstream Zed ${upstream_sha}"
          if git push origin HEAD:main; then
            echo "Merged upstream Zed ${upstream_sha} into main." >> "$GITHUB_STEP_SUMMARY"
          else
            git reset -q --hard origin/main
            needs_attention "GitHub refused to push upstream Zed ${upstream_sha}, probably because it changes workflow files. Click Sync fork on https://github.com/${GITHUB_REPOSITORY}, or add a CAYGNUS_SYNC_TOKEN secret."
          fi
          exit 0
        fi

        git merge --abort

        existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main \
          --state open --json url --jq '.[0].url // empty')
        if [[ -n "$existing_pr" ]]; then
          # Don't overwrite the branch: it may hold your conflict resolution.
          echo "::warning::Upstream still conflicts; finish ${existing_pr} first."
          echo "Upstream conflicts; waiting on ${existing_pr}." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        git checkout -q -B "$SYNC_BRANCH" upstream/main
        if [[ "$HAS_SYNC_TOKEN" != "true" ]]; then
          use_workflows_from origin/main
          git commit -q --allow-empty -m "Keep Caygnus's workflows"
        fi
        if ! git push --force origin "HEAD:refs/heads/${SYNC_BRANCH}"; then
          git checkout -q main
          needs_attention "Upstream Zed ${upstream_sha} conflicts with the fork in: $(echo ${conflicts}). GitHub refused to push it for review, so merge it by hand, or add a CAYGNUS_SYNC_TOKEN secret."
          exit 0
        fi
        git checkout -q main

        {
          echo "Upstream Zed \`${upstream_sha}\` conflicts with the fork, so it wasn't merged automatically."
          echo
          echo "Conflicting files:"
          echo
          echo "${conflicts}" | sed 's/^/- `/; s/$/`/'
          echo
          echo "Resolve the conflicts here on GitHub, or locally:"
          echo
          echo '```bash'
          echo "git fetch origin ${SYNC_BRANCH} && git checkout main && git pull"
          echo "git merge origin/${SYNC_BRANCH}"
          echo '```'
          echo
          echo "Merging this pull request releases Caygnus on the next sync run."
          echo
          echo "Release Notes:"
          echo
          echo "- N/A"
        } > pr-body.md
        if pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$SYNC_BRANCH" \
          --title "Merge upstream Zed ${upstream_sha}" --body-file pr-body.md); then
          needs_attention "Upstream Zed ${upstream_sha} conflicts with the fork. Resolve and merge ${pr_url}."
        else
          needs_attention "Upstream Zed ${upstream_sha} conflicts with the fork and is on the ${SYNC_BRANCH} branch, but the pull request couldn't be opened. Turn on \"Allow GitHub Actions to create and approve pull requests\" in the Actions settings, or open it from that branch by hand."
        fi
    - name: Check whether main changed since the last release
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sha=$(git rev-parse HEAD)
        released=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .target_commitish 2>/dev/null || true)
        if [[ "$released" == "$sha" ]]; then
          echo "The latest release already has ${sha}."
          echo "release=false" >> "$GITHUB_OUTPUT"
        else
          echo "Releasing ${sha}; the latest release was built from ${released:-nothing}."
          echo "release=true" >> "$GITHUB_OUTPUT"
        fi
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"
  release:
    needs: merge_upstream
    if: needs.merge_upstream.outputs.release == 'true'
    uses: ./.github/workflows/caygnus_release.yml
    with:
      ref: ${{ needs.merge_upstream.outputs.sha }}
    permissions:
      contents: write
  report:
    needs: merge_upstream
    if: needs.merge_upstream.outputs.attention != ''
    runs-on: ubuntu-latest
    steps:
    - name: Ask for a hand
      env:
        ATTENTION: ${{ needs.merge_upstream.outputs.attention }}
      run: |
        echo "::error::${ATTENTION}"
        exit 1
